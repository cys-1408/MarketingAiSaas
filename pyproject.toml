[project]
name = "marketingaisaas"
version = "0.1.0"
description = "Multi-tenant SaaS for marketing intelligence and campaign investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "email-validator>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    # Source parsers: part of the ingestion pipeline, not optional.
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Optional heavyweight extras (installed only when actually configured).
retrieval = [
    "pgvector>=0.3",
    "sentence-transformers>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
